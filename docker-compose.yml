services:
  # ============================================================
  # container_postgres_16
  # ============================================================
  container_postgres_16:
    image: postgres:16
    container_name: container_postgres_16
    restart: unless-stopped

    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres

    networks:
      - postgres_16_network

    volumes:
      - volumes_postgres_16:/var/lib/postgresql/data

    ports:
      - "5632:5432"

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G


    command:
      - postgres
      - -c
      - shared_buffers=768MB

      - -c
      - effective_cache_size=2GB

      - -c
      - work_mem=8MB

      - -c
      - maintenance_work_mem=256MB

      - -c
      - autovacuum_work_mem=128MB

      - -c
      - max_connections=50

      - -c
      - wal_buffers=16MB

      - -c
      - checkpoint_completion_target=0.9

      - -c
      - min_wal_size=512MB

      - -c
      - max_wal_size=2GB

      - -c
      - random_page_cost=1.1

      - -c
      - effective_io_concurrency=100

      - -c
      - default_statistics_target=100

      - -c
      - autovacuum=on

      - -c
      - idle_in_transaction_session_timeout=300000

volumes:
  volumes_postgres_16:

networks:
  postgres_16_network:
    name: postgres_16_network
    driver: bridge